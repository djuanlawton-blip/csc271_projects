<!DOCTYPE html>
<html>
<head>
    <title>Submit A Recipe</title>
</head>

<body>

    <h1>Submit Your Own Recipe</h1>

    <form action="index.html" method="get">

        <label for="recipe-name">Recipe Name:</label>
        <input type="text" id="recipe Name" name="recipe Name">
        <br><br>

        <label for="ingredients">Ingredients:</label><br>
        <textarea id="ingredients" name="ingredients" rows="8" cols="50"></textarea>
        <br><br>

        <label for="instructions">Instructions:</label><br>
        <textarea id="instructions" name="instructions" rows="8" cols="50"></textarea>
        <br><br>

        <p>Difficulty Level:</p>

        <input type="radio" id="easy" name="difficulty" value="easy">
        <label for="easy">Easy</label>

        <input type="radio" id="medium" name="difficulty" value="medium">
        <label for="medium">Medium</label>

        <input type="radio" id="hard" name="difficulty" value="hard">
        <label for="hard">Hard</label>

        <p>Dietary Preferences:</p>

        <input type="checkbox" id="vegetarian" name="dietary" value="vegetarian">
        <label for="vegetarian">Vegetarian</label>

        <input type="checkbox" id="vegan" name="dietary" value="vegan">
        <label for="vegan">Vegan</label>

        <input type="checkbox" id="gluten-free" name="dietary" value="gluten-free">
        <label for="gluten-free">Gluten-Free</label>

        <input type="checkbox" id="dairy-free" name="dietary" value="dairy-free">
        <label for="dairy-free">Dairy-Free</label>

        <br><br>

        <input type="submit" value="Submit Recipe">

    </form>

    <p>
        <a href="index.html">Back to Home Page</a>
    </p>

</body>
</html>
